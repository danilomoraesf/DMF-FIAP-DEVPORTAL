services:
  mfe-dashboard:
    build:
      context: ./remotes/mfe-dashboard
    image: devportal/mfe-dashboard:1.0.0
    ports:
      - "4201:80"

  mfe-users:
    build:
      context: ./remotes/mfe-users
    image: devportal/mfe-users:1.0.0
    ports:
      - "4202:80"

  host:
    build:
      context: ./host
    image: devportal/host:1.0.0
    ports:
      - "4200:80"
    depends_on:
      - mfe-dashboard
      - mfe-users
