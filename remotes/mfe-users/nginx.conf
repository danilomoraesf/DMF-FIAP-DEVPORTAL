server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Needed so a browser loading one app's origin can fetch another
  # app's remoteEntry.json / shared chunks across ports.
  add_header Access-Control-Allow-Origin * always;
  add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
  add_header Access-Control-Allow-Headers "*" always;

  # nginx's default mime.types doesn't map .mjs — without this, native
  # federation's shared chunks are served as text/plain and the browser
  # refuses to load them as modules.
  location ~* \.mjs$ {
    default_type application/javascript;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
