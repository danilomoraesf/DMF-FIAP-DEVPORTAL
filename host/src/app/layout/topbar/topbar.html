<header class="topbar">
  <div class="brand">DevPortal</div>

  <div class="spacer"></div>

  <div class="user">
    <span class="user-name">{{ shellState.user().name }}</span>
    <span class="user-role">{{ shellState.user().role }}</span>
  </div>

  <app-button variant="secondary" (clicked)="shellState.toggleSidebar()">
    {{ shellState.sidebarCollapsed() ? 'Expandir menu' : 'Recolher menu' }}
  </app-button>
</header>
