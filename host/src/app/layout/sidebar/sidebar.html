<nav class="sidebar" [class.collapsed]="shellState.sidebarCollapsed()">
  <div class="nav-items">
    @for (item of navItems; track item.path) {
      <a
        class="nav-item"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
      >
        {{ item.label }}
      </a>
    }
  </div>

  <button type="button" class="toggle" (click)="shellState.toggleSidebar()">
    @if (shellState.sidebarCollapsed()) {
      <span>»</span>
    } @else {
      <span>« Recolher menu</span>
    }
  </button>
</nav>
